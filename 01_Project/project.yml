name: LLM-UsageStatus
options:
  bundleIdPrefix: com.sim
  deploymentTarget:
    macOS: "15.0"
packages:
  HelpMenu:
    path: HelpMenu
  AppCitizenshipKit:
    path: Vendor/AppCitizenshipKit
  FeedbackKit:
    path: Vendor/FeedbackKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "202"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  LLM-UsageStatus:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - LLM-UsageStatus.entitlements
    dependencies:
      - package: HelpMenu
      - package: AppCitizenshipKit
      - package: FeedbackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim.LLM-UsageStatus
        PRODUCT_MODULE_NAME: LLMUsageStatus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LLM Usage Status
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Resources/LLM-UsageStatus.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - LLM-UsageStatusTests
  LLM-UsageStatusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: LLM-UsageStatus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim.LLM-UsageStatusTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
